  # ---- SDK API ----
  /sdk/v1/snapshot:
    get:
      summary: Fetch a full config snapshot for the SDK's project and environment
      operationId: sdkSnapshot
      tags: [SDK]
      security:
        - SDKKeyAuth: []
      responses:
        "200":
          description: Full snapshot of flags and segments
          content:
            application/json:
              schema:
                type: object
                description: Snapshot object (flags and segments keyed by their keys)
        "401":
          description: Missing or invalid SDK key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Could not build snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sdk/v1/stream:
    get:
      summary: Subscribe to real-time flag updates via Server-Sent Events
      description: >
        Opens a persistent SSE connection. The server sends an initial `put`
        event with the full snapshot, then subsequent `put` events whenever
        the flag configuration changes. Supports resumption via the
        `Last-Event-ID` request header.
      operationId: sdkStream
      tags: [SDK]
      security:
        - SDKKeyAuth: []
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: Last seen event version for delta replay
      responses:
        "200":
          description: SSE stream (Content-Type text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  Newline-delimited SSE frames. Each frame has:
                  id: <version>
                  event: put
                  data: <JSON snapshot>
        "401":
          description: Missing or invalid SDK key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Streaming not supported or snapshot build failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sdk/v1/evaluate:
    post:
      summary: Evaluate a single flag for a given context
      operationId: sdkEvaluate
      tags: [SDK]
      security:
        - SDKKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateRequest"
      responses:
        "200":
          description: Flag evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid SDK key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Flag not found in snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Could not build snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sdk/v1/track:
    post:
      summary: Ingest analytics events
      operationId: sdkTrack
      tags: [SDK]
      security:
        - SDKKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/TrackEvent"
      responses:
        "204":
          description: Events accepted (no body)
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid SDK key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---- Health / Observability ----
  /health:
    get:
      summary: Liveness probe — checks store connectivity
      operationId: health
      tags: [Health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service is degraded (store unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      summary: Readiness probe — used by Kubernetes to gate traffic
      operationId: ready
      tags: [Health]
      responses:
        "200":
          description: Service is ready to receive traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
        "503":
          description: Store unavailable; not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /metrics:
    get:
      summary: Prometheus metrics endpoint
      description: Exposes all Pennant metrics in the Prometheus text exposition format.
      operationId: metrics
      tags: [Health]
      responses:
        "200":
          description: Prometheus metrics text
          content:
            text/plain:
              schema:
                type: string

tags:
  - name: Auth
    description: Authentication and session management
  - name: Projects
    description: Project CRUD operations
  - name: Audit
    description: Audit log for change history
  - name: Environments
    description: Environment management within a project
  - name: SDK Keys
    description: SDK key issuance and revocation
  - name: Flags
    description: Feature flag management and per-environment configuration
  - name: Segments
    description: User segment definitions
  - name: Experiments
    description: A/B experiment management and results
  - name: SDK
    description: SDK-facing API for flag evaluation and event tracking
  - name: Health
    description: Health, readiness, and observability endpoints
