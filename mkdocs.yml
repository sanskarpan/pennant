site_name: Pennant
site_description: Self-hosted feature flag service with real-time SSE streaming, Go and TypeScript SDKs, and built-in A/B testing
site_url: https://sanskarpan.github.io/pennant
repo_url: https://github.com/sanskarpan/pennant
repo_name: sanskarpan/pennant

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: getting-started/quick-start.md
    - Configuration: getting-started/configuration.md
    - Docker Compose: getting-started/docker-compose.md
  - Concepts:
    - How Evaluation Works: concepts/evaluation.md
    - Segments and Targeting: concepts/segments.md
    - Percentage Rollouts: concepts/rollouts.md
    - A/B Testing: concepts/ab-testing.md
  - API Reference:
    - Authentication: api/authentication.md
    - Flags: api/flags.md
    - Segments: api/segments.md
    - Experiments: api/experiments.md
    - SDK Endpoints: api/sdk-endpoints.md
  - SDKs:
    - Go SDK: sdk/go.md
    - TypeScript SDK: sdk/typescript.md
  - Deployment:
    - Production Checklist: deployment/checklist.md
    - Kubernetes: deployment/kubernetes.md
    - TLS: deployment/tls.md
  - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sanskarpan/pennant

copyright: MIT License
